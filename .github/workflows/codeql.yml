name: "Perform CodeQL Analysis"

on:
  push:
    branches:
      - rolling
  pull_request:
    branches:
      - rolling
  schedule:
    - cron: '28 13 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis-call:
    uses: vyos/.github/.github/workflows/codeql-analysis.yml@b0082401423f12eb68200266227edc8bb54c9937
    with:
      languages: "['c-cpp']"
      build-mode: "none"
      build-command: "make"
